services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskqueue
      POSTGRES_PASSWORD: taskqueue
      POSTGRES_DB: taskqueue
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskqueue"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./migrations:/migrations:ro
    command: [
      "-path", "/migrations",
      "-database", "postgres://taskqueue:taskqueue@postgres:5432/taskqueue?sslmode=disable",
      "up"
    ]

  producer:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: producer
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      - DB_DSN=postgres://taskqueue:taskqueue@postgres:5432/taskqueue?sslmode=disable
      - REDIS_ADDR=redis:6379
      - ORG_ID=00000000-0000-4000-8000-000000000001
    ports:
      - "${API_PORT:-8080}:8080"

  worker-default:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      - DB_DSN=postgres://taskqueue:taskqueue@postgres:5432/taskqueue?sslmode=disable
      - REDIS_ADDR=redis:6379
      - WORKER_CONCURRENCY=10
      - QUEUE_NAME=default
      - ORG_ID=00000000-0000-4000-8000-000000000001
    deploy:
      replicas: 2

  worker-email:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      - DB_DSN=postgres://taskqueue:taskqueue@postgres:5432/taskqueue?sslmode=disable
      - REDIS_ADDR=redis:6379
      - WORKER_CONCURRENCY=10
      - QUEUE_NAME=email
      - ORG_ID=00000000-0000-4000-8000-000000000001
    deploy:
      replicas: 2

  webhook-worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: webhook-worker
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      - DB_DSN=postgres://taskqueue:taskqueue@postgres:5432/taskqueue?sslmode=disable
      - WEBHOOK_DELIVERY_TIMEOUT_SEC=10
      - WEBHOOK_DELIVERY_POLL_INTERVAL_SEC=1

volumes:
  pgdata:
